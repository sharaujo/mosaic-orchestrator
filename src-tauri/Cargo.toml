[package]
name = "mosaico"
version = "1.7.6"
description = "mosAIco — workspace for coding agents and terminals"
authors = ["sharaujo"]
license = "AGPL-3.0-or-later"
edition = "2021"
# Two binaries in this crate (mosaico + mosaico-orchestrator-mcp). Without
# default-run, the bare `cargo run` that `tauri dev` issues cannot pick one and
# aborts before the app ever starts.
default-run = "mosaico"

[lib]
name = "mosaico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# ghostty_linked is a custom cfg enabled only when the native Ghostty backend
# is linked in build.rs; register it to avoid unexpected-cfg warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ghostty_linked)"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
nanoid = "0.4"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a round-tripped Value in file order. Without it, rewriting one
# key of ~/.claude.json would alphabetise its other 80+ top-level keys.
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
github-copilot-sdk = "1.0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "process", "io-util", "macros"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
which = "6"
zip = "0.6"
sha2 = "0.10"
sysinfo = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hex = "0.4"
cpal = "0.15"
# On-device STT. Pin wrapper/sys/native together; the build script fetches matching prebuilts.
sherpa-onnx = "=2.0.1"
tiny_http = "0.12"
# keyring v3 has no platform backend by default. Enable each native backend
# below so get_password does not fall back to a mock store.
keyring = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs-next = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
urlencoding = "2"
dotenvy = "0.15"
discord-rich-presence = "1.1.0"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
# toml_edit, not toml: it preserves comments, key order and formatting, which is
# required to change one `[mcp_servers.*]` table inside a user's ~/.codex/config.toml
# without rewriting the credentials, hooks and project tables around it.
toml_edit = "0.22"

# Prevent concurrent mosAIco instances, as required by the save_projects
# monotonicity guard. This crate supports desktop platforms only.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only dependencies for embedding Ghostty surfaces above the Tauri WebView.
# Versions match Tauri 2.11 to avoid duplicate crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Keychain backend used for Claude Code OAuth tokens on macOS.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Windows-only registry and Win32 dependencies.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows Credential Manager backend.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Linux Secret Service backend (GNOME Keyring / KWallet). This feature pair
# avoids Tokio and system crypto libraries for D-Bus session encryption.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Match the webkit2gtk version Tauri already pulls so we can enable media-stream
# and answer permission-request for getUserMedia (voice dictation).
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }

# Development unwinds command panics so HMR sessions can recover; release
# aborts for a smaller binary.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "s"
strip = true
