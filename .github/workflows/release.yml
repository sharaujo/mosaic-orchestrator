name: Release

on:
  # Only the separate post-merge tag operation starts a release.
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize attempts for the same tag, including reruns; never cancel an upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64, verify, and publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate tag and prepare or reuse draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-assets.mjs prepare

      - name: Install Rust
        if: steps.draft.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        if: steps.draft.outputs.published != 'true'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
          key: registry-only-v1
          cache-targets: 'false'

      - name: Install frontend dependencies
        if: steps.draft.outputs.published != 'true'
        run: npm ci

      - name: Verify legal resources and prepare corresponding source
        if: steps.draft.outputs.published != 'true'
        run: node scripts/license-distribution.mjs prepare

      - name: Verify frontend
        if: steps.draft.outputs.published != 'true'
        run: npm test

      - name: Build and upload Tauri bundles to draft
        if: steps.draft.outputs.published != 'true'
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # An explicit ID prevents the action from creating another release.
          releaseId: ${{ steps.draft.outputs.release-id }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.json

      - name: Verify notices and source inside both Windows installers
        if: steps.draft.outputs.published != 'true'
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/license-distribution.mjs check --artifacts

      - name: Verify installers, apply notes, then publish
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/release-assets.mjs publish
